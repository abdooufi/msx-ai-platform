version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
# Persistent data lives in ./data/ on the HOST machine.
# Safe commands:
#   docker compose down          ← stops containers, DATA IS KEPT
#   docker compose down --rmi local ← removes images too, DATA IS KEPT
#
# DANGEROUS (avoid unless intentional):
#   docker compose down -v       ← would remove named volumes (none used here)
#   rm -rf ./data/               ← deletes all data on the host
# ─────────────────────────────────────────────────────────────────────────────

services:

  # --- Nginx reverse-proxy ---
  nginx:
    image: nginx:alpine
    ports:
      - '90:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [frontend, backend]
    restart: unless-stopped
    networks: [msx-net]

  # --- Frontend (Next.js) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:3001
    depends_on: [backend]
    restart: unless-stopped
    networks: [msx-net]

  # --- Backend (NestJS) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - NODE_ENV=production
    volumes:
      - ./data/uploads:/app/uploads        # uploaded documents
      - ./data/logs:/app/logs              # application logs
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks: [msx-net]

  # --- MongoDB (conversations, analytics, knowledge) ---
  mongodb:
    image: mongo:7
    volumes:
      - ./data/mongodb:/data/db            # ← host folder, survives docker down
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [msx-net]

  # --- Qdrant (vector index) ---
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - '6333:6333'
    volumes:
      - ./data/qdrant:/qdrant/storage      # ← host folder, survives docker down
    restart: unless-stopped
    networks: [msx-net]

  # --- Redis (cache + Bull job queue) ---
  redis:
    image: redis:7-alpine
    command: >
      redis-server
        --requirepass redispass
        --appendonly yes
        --appendfsync everysec
        --save 60 1
    volumes:
      - ./data/redis:/data                 # ← host folder, AOF + RDB snapshots
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'redispass', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [msx-net]

# No named volumes needed — everything is bind-mounted to ./data/
networks:
  msx-net:
    driver: bridge
