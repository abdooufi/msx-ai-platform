version: '3.9'

services:
  # --- Nginx reverse proxy ---
  nginx:
    image: nginx:alpine
    ports:
      - '90:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    networks: [msx-net]

  # --- Frontend (Next.js) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:3001
    depends_on: [backend]
    restart: unless-stopped
    networks: [msx-net]

  # --- Backend (NestJS) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      - NODE_ENV=production
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks: [msx-net]

  # --- Qdrant vector database ---
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - '6333:6333'
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped
    networks: [msx-net]

  # --- Redis ---
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass redispass --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'redispass', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [msx-net]

volumes:
  qdrant_data:
  redis_data:
  uploads:
  logs:

networks:
  msx-net:
    driver: bridge
