worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
  worker_connections 1024;
  use epoll;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent" $request_time';
  access_log /var/log/nginx/access.log main;

  sendfile        on;
  tcp_nopush      on;
  tcp_nodelay     on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml;
  gzip_min_length 1000;

  # Rate limiting
  limit_req_zone  $binary_remote_addr zone=api:10m  rate=60r/m;   # public API — 1 req/s avg
  limit_req_zone  $binary_remote_addr zone=chat:10m rate=10r/m;   # chat SSE — stricter
  limit_req_zone  $binary_remote_addr zone=admin:10m rate=300r/m; # admin panel — 5 req/s avg

  # Docker DNS resolver — needed for dynamic re-resolution after container restarts
  resolver 127.0.0.11 valid=5s ipv6=off;

  upstream backend  { server backend:3001  max_fails=3 fail_timeout=10s; keepalive 32; }
  upstream frontend { server frontend:3000 max_fails=3 fail_timeout=10s; keepalive 32; }

  # Global proxy timeouts
  proxy_connect_timeout  10s;   # wait up to 10 s for backend TCP accept
  proxy_send_timeout     60s;
  proxy_read_timeout     60s;

  server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Chat endpoint — stricter rate limit
    location /api/chat {
      limit_req zone=chat burst=5 nodelay;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header Connection        '';
      # SSE: disable buffering
      proxy_buffering       off;
      proxy_cache           off;
      proxy_read_timeout    300s;
      chunked_transfer_encoding on;
    }

    # Swagger docs (dev only — NestJS disables in production)
    location /docs {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # File upload — longer read timeout for large PDFs/ZIPs
    location /api/upload {
      limit_req zone=api burst=10 nodelay;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header Connection        "";
      proxy_read_timeout     120s;
      client_max_body_size   100M;
    }

    # Admin API — authenticated, higher rate limit for dashboard polling
    location /api/admin {
      limit_req zone=admin burst=60 nodelay;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header Connection        "";
      client_max_body_size 60M;
    }

    # All other API endpoints
    location /api {
      limit_req zone=api burst=30 nodelay;
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header Connection        "";
      client_max_body_size 60M;
    }

    # Static uploads served by backend
    location /uploads {
      proxy_pass http://backend;
    }

    # /embed — iframe page for the embeddable widget.
    # Must be frameable from ANY external origin, so we override
    # X-Frame-Options (nginx child location headers do NOT inherit parent).
    location /embed {
      # No X-Frame-Options → allow framing from any origin
      add_header Content-Security-Policy  "frame-ancestors *"                   always;
      add_header X-Content-Type-Options   "nosniff"                              always;
      add_header X-XSS-Protection         "1; mode=block"                        always;
      add_header Referrer-Policy          "strict-origin-when-cross-origin"      always;

      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        "upgrade";
    }

    # widget.js served directly from Next.js public folder
    location = /widget.js {
      # Allow cross-origin script loads
      add_header Access-Control-Allow-Origin  "*"       always;
      add_header Cache-Control                "public, max-age=300" always;

      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Frontend (Next.js)
    location / {
      proxy_pass http://frontend;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        "upgrade";
    }
  }

  # ═══════════════════════════════════════════════════════════════════
  # HTTPS — production (msx.om)
  #
  # To enable:
  #   1. Place your certificate + key in ./nginx/ssl/ :
  #        nginx/ssl/fullchain.pem
  #        nginx/ssl/privkey.pem
  #      (e.g. from Let's Encrypt: certbot certonly --standalone -d ai.msx.om)
  #   2. Mount them in docker-compose.yml under the nginx service:
  #        - ./nginx/ssl:/etc/nginx/ssl:ro
  #      and expose port 443:  - '443:443'
  #   3. Uncomment the server block below and set your server_name.
  #   4. In the port-80 server above, replace the location blocks with:
  #        location / { return 301 https://$host$request_uri; }
  #      (keep /.well-known/acme-challenge/ if you use certbot webroot renewal)
  # ═══════════════════════════════════════════════════════════════════
  #
  # server {
  #   listen 443 ssl;
  #   http2 on;
  #   server_name ai.msx.om;
  #
  #   ssl_certificate           /etc/nginx/ssl/fullchain.pem;
  #   ssl_certificate_key       /etc/nginx/ssl/privkey.pem;
  #   ssl_protocols             TLSv1.2 TLSv1.3;
  #   ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
  #   ssl_prefer_server_ciphers off;
  #   ssl_session_cache         shared:SSL:10m;
  #   ssl_session_timeout       1d;
  #
  #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  #   add_header X-Frame-Options "SAMEORIGIN" always;
  #   add_header X-Content-Type-Options "nosniff" always;
  #   add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  #
  #   # …then duplicate the same location blocks as the port-80 server above
  #   # (/api/chat, /docs, /api/upload, /api/admin, /api, /uploads, /embed,
  #   #  /widget.js, /) — they are identical.
  # }
}
